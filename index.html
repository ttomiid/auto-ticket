<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOC Ticket Composer</title>
  <meta name="description" content="Generador de tickets de escalamiento L2 para analistas SOC. Completá el formulario y copiá el ticket en texto plano." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-title">SOC Ticket Composer</span>
      <span class="topbar-subtitle">Escalamiento a L2</span>
    </div>
    <span class="status-pill" id="statusPill">Borrador</span>
  </header>

  <main class="layout">

    <section class="form-panel" aria-label="Formulario de escalamiento">

      <div class="field-group">
        <label class="field-label">Severidad</label>
        <div class="severity-grid" role="radiogroup" aria-label="Severidad">
          <button type="button" class="sev-btn sev-baja" data-value="Baja" role="radio" aria-checked="false">Baja</button>
          <button type="button" class="sev-btn sev-media" data-value="Media" role="radio" aria-checked="false">Media</button>
          <button type="button" class="sev-btn sev-alta" data-value="Alta" role="radio" aria-checked="true">Alta</button>
          <button type="button" class="sev-btn sev-critica" data-value="Crítica" role="radio" aria-checked="false">Crítica</button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="alertTitle">Título de la alerta original <span class="field-hint">(SIEM / EDR)</span></label>
        <input type="text" id="alertTitle" class="text-input" placeholder="Ej: Multiple failed logon attempts followed by success — svc account" />
      </div>

      <div class="field-group">
        <label class="field-label" for="iocs">Indicadores <span class="field-hint">(IPs, dominios o hashes — uno por línea)</span></label>
        <textarea id="iocs" class="text-area mono" rows="3" placeholder="185.220.101.47"></textarea>
      </div>

      <div class="field-group">
        <label class="field-label" for="assets">Activos afectados <span class="field-hint">(hostnames — uno por línea)</span></label>
        <textarea id="assets" class="text-area mono" rows="3" placeholder="DC-PROD-01&#10;FILESRV-02"></textarea>
      </div>

      <div class="field-group">
        <label class="field-label" for="analystNotes">Notas del analista</label>
        <textarea id="analystNotes" class="text-area" rows="5" placeholder="Contexto, hallazgos, acciones ya tomadas..."></textarea>
      </div>

      <div class="field-group">
        <label class="field-label" for="recommendation">Acción recomendada para L2</label>
        <select id="recommendation" class="select-input">
          <option value="">Sin especificar</option>
          <option>Aislar host de la red</option>
          <option>Deshabilitar cuenta comprometida</option>
          <option>Forzar reset de credenciales</option>
          <option>Bloquear IOC en perímetro</option>
          <option>Escalar a IR / respuesta a incidentes</option>
        </select>
      </div>

      <button type="button" class="reset-btn" id="resetBtn">Limpiar formulario</button>

    </section>

    <section class="preview-panel" aria-label="Vista previa del ticket">
      <div class="preview-header">
        <span class="preview-label">Ticket generado</span>
        <div class="preview-actions">
          <button type="button" class="action-btn" id="copyBtn">Copiar ticket</button>
          <button type="button" class="action-btn action-btn-ghost" id="downloadBtn">Descargar .txt</button>
        </div>
      </div>
      <pre class="preview-output mono" id="previewOutput"></pre>
      <span class="copy-toast" id="copyToast">Copiado al portapapeles</span>
    </section>

  </main>

  <footer class="page-footer">
    Los datos completados no se envían a ningún servidor — todo se genera en tu navegador.
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
