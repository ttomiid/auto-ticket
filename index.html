<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOC Ticket Composer</title>
  <meta name="description" content="Generador de tickets de escalamiento L2 para analistas SOC. Completá el formulario y copiá el ticket en texto plano." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-title">SOC Ticket Composer</span>
      <span class="topbar-subtitle">Escalamiento a L2</span>
    </div>
    <div class="topbar-actions">
      <button type="button" class="action-btn action-btn-ghost" id="exportShiftBtn">Exportar turno (PDF)</button>
      <span class="status-pill" id="statusPill">Borrador</span>
    </div>
  </header>

  <nav class="tab-bar" id="tabBar" role="tablist" aria-label="Alertas abiertas">
    <!-- las pestañas se generan por JS -->
    <button type="button" class="tab-add-btn" id="addTabBtn" title="Nueva alerta" aria-label="Nueva alerta">+</button>
  </nav>

  <main class="layout">

    <section class="form-panel" aria-label="Formulario de escalamiento">

      <div class="field-group">
        <label class="field-label">Severidad</label>
        <div class="chip-group" id="severityGroup" role="radiogroup" aria-label="Severidad"></div>
        <div class="chip-add-row">
          <input type="text" id="severityAddInput" class="chip-add-input" placeholder="Agregar nivel personalizado" maxlength="40" />
          <button type="button" class="chip-add-btn" id="severityAddBtn">Agregar</button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="alertTitle">Título de la alerta original <span class="field-hint">(SIEM / EDR)</span></label>
        <input type="text" id="alertTitle" class="text-input" placeholder="Ej: Multiple failed logon attempts followed by success — svc account" />
      </div>

      <div class="field-group">
        <label class="field-label" for="iocs">Indicadores <span class="field-hint">(IPs, dominios o hashes — uno por línea)</span></label>
        <textarea id="iocs" class="text-area mono" rows="3" placeholder="185.220.101.47"></textarea>
      </div>

      <div class="field-group">
        <label class="field-label" for="assets">Activos afectados <span class="field-hint">(hostnames — uno por línea)</span></label>
        <textarea id="assets" class="text-area mono" rows="3" placeholder="DC-PROD-01&#10;FILESRV-02"></textarea>
      </div>

      <div class="field-group">
        <label class="field-label" for="analystNotes">Notas del analista</label>
        <textarea id="analystNotes" class="text-area" rows="5" placeholder="Contexto, hallazgos, acciones ya tomadas..."></textarea>
      </div>

      <div class="field-group">
        <label class="field-label">Acciones recomendadas para L2 <span class="field-hint">(elegí una o varias)</span></label>
        <div class="chip-group" id="actionsGroup" role="group" aria-label="Acciones recomendadas"></div>
        <div class="chip-add-row">
          <input type="text" id="actionAddInput" class="chip-add-input" placeholder="Agregar acción personalizada" maxlength="80" />
          <button type="button" class="chip-add-btn" id="actionAddBtn">Agregar</button>
        </div>
      </div>

      <button type="button" class="reset-btn" id="resetBtn">Limpiar esta alerta</button>

    </section>

    <section class="preview-panel" aria-label="Vista previa del ticket">
      <div class="preview-header">
        <span class="preview-label">Ticket generado</span>
        <div class="preview-actions">
          <button type="button" class="action-btn" id="copyBtn">Copiar ticket</button>
          <button type="button" class="action-btn action-btn-ghost" id="downloadBtn">Descargar .txt</button>
        </div>
      </div>
      <pre class="preview-output mono" id="previewOutput"></pre>
      <span class="copy-toast" id="copyToast">Copiado al portapapeles</span>
    </section>

  </main>

  <footer class="page-footer">
    Los datos completados no se envían a ningún servidor — todo se guarda solo en tu navegador (pestañas, etiquetas y notas incluidas).
  </footer>

  <!-- Solo visible al imprimir / exportar a PDF: se arma dinámicamente con todas las pestañas -->
  <div class="print-report" id="printReport" aria-hidden="true"></div>

  <script src="js/app.js"></script>
</body>
</html>
